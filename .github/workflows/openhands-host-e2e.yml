name: OpenHands host e2e

# The real OpenHands host boundary (#4572). The guide marks OpenHands CLI, SDK
# and Cloud as fully integrated and calls HUQAN a `pre_tool_use` guard, but the
# only evidence on main drove HUQAN's own projection: no host was started, so
# nothing proved the host emits the documented payload, runs the hook, or
# suppresses its own executor on a deny.
#
# This job installs the gate with the repository's installer, then runs a real
# OpenHands SDK host against it and records what the host actually does. The SDK
# is a Python dependency the npm shards never install, so this cannot be a shard
# test; it lives here, like the authority install e2e.
#
# Pull-request only and not a required check, on purpose: it downloads the SDK
# and is slower than the gates that decide a merge. It exists to produce the
# host-boundary evidence, not to gate every PR.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhands-host-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-e2e:
    name: Host e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUQAN_OPENHANDS_E2E: '1'
      # The SDK version the driver's private-name access (`agent._ActionBatch`)
      # was written against. An upgrade that moves that path fails loudly in the
      # driver rather than silently skipping the executor-suppression check.
      OPENHANDS_SDK_VERSION: '1.34.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install repository dependencies
        run: npm ci

      - name: Install the pinned OpenHands SDK
        run: python -m pip install "openhands-sdk==${OPENHANDS_SDK_VERSION}"

      - name: Record the host version
        run: python -c "from importlib.metadata import version; print('openhands-sdk', version('openhands-sdk'))"

      - name: Run the OpenHands host e2e
        # The test appends one JSON line per case to the report path; the
        # artifact step below uploads it so the host invocation, decision and
        # receipt are correlated off-run. `runner.temp` is only available inside
        # a step, not in a job-level `env:` block.
        env:
          HUQAN_OPENHANDS_E2E_REPORT: ${{ runner.temp }}/openhands-host-e2e-report.ndjson
        run: node --test test/issue-4572-openhands-host-e2e.test.js

      - name: Upload the host-boundary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openhands-host-e2e-report
          path: ${{ runner.temp }}/openhands-host-e2e-report.ndjson
          # The report is written only when the e2e actually runs. If the SDK
          # failed to install or the interpreter probe missed it, the tests skip
          # and this file is absent -- which must fail the job, not pass green on
          # a run that proved nothing.
          if-no-files-found: error
