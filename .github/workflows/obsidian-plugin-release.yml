name: Obsidian Plugin

on:
  pull_request:
    paths:
      - 'obsidian-plugin/**'
      - '.github/workflows/obsidian-plugin-release.yml'
  push:
    branches:
      - main
    paths:
      - 'obsidian-plugin/**'
      - '.github/workflows/obsidian-plugin-release.yml'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish the manifest version as a GitHub prerelease after validation'
        required: true
        type: boolean
        default: false

# A new plugin push supersedes stale validation; release pushes are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The workflow's own path filter includes this file, so editing it puts the
  # workflow on main -- and `publish-prerelease` used to fire on any such push.
  # On 2026-08-21 a commit that only changed `node-version: 20` to 22 in this
  # file attempted to publish the plugin. Nothing shipped, because the release
  # provenance check refused to move the existing 1.1.0 release to a different
  # commit, but it left main with a failing check for a release nobody asked
  # for. Editing CI configuration must not attempt a release.
  #
  # Classification mirrors conformance.yml: diff the push range and look for a
  # real change under obsidian-plugin/.
  classify:
    name: Classify plugin change
    runs-on: ubuntu-latest
    outputs:
      plugin_changed: ${{ steps.classify.outputs.plugin_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed surface
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          plugin_changed=false
          reason="no obsidian-plugin/ change in this push"

          # An unavailable diff base (first push to a branch, forced update)
          # must not silently answer "nothing changed" -- that would turn a
          # missing diff into a skipped release. Fail open to true and let the
          # provenance check downstream stay the thing that refuses.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            plugin_changed=true
            reason="manual run or unavailable diff base"
          else
            mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            printf 'Changed files:\n'
            printf ' - %s\n' "${changed[@]}"

            for path in "${changed[@]}"; do
              case "$path" in
                obsidian-plugin/*)
                  plugin_changed=true
                  reason="obsidian-plugin/ changed"
                  ;;
              esac
            done
          fi

          {
            echo "plugin_changed=$plugin_changed" >> "$GITHUB_OUTPUT"
            echo "### Obsidian plugin change" >> "$GITHUB_STEP_SUMMARY"
            echo "- Plugin changed: **$plugin_changed**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: $reason" >> "$GITHUB_STEP_SUMMARY"
          }

  build:
    name: Build and validate plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit plugin dependencies
        run: npm audit --audit-level=high

      - name: Validate release contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
            throw new Error(`manifest.version must be x.y.z, got ${manifest.version}`);
          }
          if (!/^[a-z-]+$/.test(manifest.id) || manifest.id.includes('obsidian') || manifest.id.endsWith('plugin')) {
            throw new Error(`invalid Obsidian plugin id: ${manifest.id}`);
          }
          if (typeof manifest.minAppVersion !== 'string' || !manifest.minAppVersion) {
            throw new Error('manifest.minAppVersion is required');
          }
          if (versions[manifest.version] && versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error(`versions.json mismatch for ${manifest.version}`);
          }
          for (const file of ['main.js', 'manifest.json', 'styles.css']) {
            if (!fs.existsSync(file)) throw new Error(`missing release asset: ${file}`);
          }
          console.log(`PLUGIN_VERSION=${manifest.version}`);
          console.log(`MIN_APP_VERSION=${manifest.minAppVersion}`);
          NODE

      - name: Production build
        run: npm run build

      - name: Generate release checksums
        run: sha256sum main.js manifest.json styles.css > SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huqan-trust-panel-release-assets
          path: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
            obsidian-plugin/SHA256SUMS.txt
          if-no-files-found: error

      - name: Verify committed bundle is reproducible
        working-directory: .
        run: git diff --exit-code -- obsidian-plugin/main.js obsidian-plugin/styles.css

  publish-prerelease:
    name: Publish beta prerelease
    # A push publishes only when the plugin itself changed. A dispatch still
    # publishes on the operator's explicit say-so, whatever changed.
    if: (github.event_name == 'push' && needs.classify.outputs.plugin_changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease == true)
    needs: [classify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: huqan-trust-panel-release-assets
          path: obsidian-plugin

      - name: Resolve plugin version
        id: version
        working-directory: obsidian-plugin
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" 2>/dev/null)"; then
            existing_target="$(printf '%s' "$release_json" | jq -r '.target_commitish // empty')"
            echo "Existing release $VERSION targets ${existing_target}."
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "Refusing to reuse version $VERSION for a different commit." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub prerelease
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "HUQAN Trust Panel $VERSION beta" \
            --prerelease \
            --notes "Beta release of HUQAN Trust Panel. Requires a local HUQAN runtime. Verification is read-only and the API key is restricted to loopback endpoints." \
            obsidian-plugin/main.js \
            obsidian-plugin/manifest.json \
            obsidian-plugin/styles.css \
            obsidian-plugin/SHA256SUMS.txt
