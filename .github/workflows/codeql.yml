name: CodeQL

# Semantic code scanning. Semgrep in security.yml matches patterns; CodeQL
# follows data flow, so it finds the class of bug a pattern cannot see -- an
# HTTP body or MCP tool argument that reaches fs, child_process or a SQL
# string several calls later. Results land in the Security tab as alerts.
#
# Not a required check yet: the first scan establishes the alert baseline, and
# making it blocking before that baseline is triaged would turn existing
# findings into a red main.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - 'lib/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          # security-extended adds lower-precision security queries on top of
          # the default suite. HUQAN is a security product; the extra noise is
          # the right trade.
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - graphify-out
              - fixtures
              - benchmarks

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:javascript-typescript
