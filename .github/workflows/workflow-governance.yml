name: Workflow Governance

on:
  # This check is intentionally cheap and runs on every PR so it can be a
  # stable required status check rather than a path-filtered optional signal.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance:
    name: Workflow governance
    runs-on: ubuntu-latest
    # Reading the pull request's commit list needs more than the top-level
    # read-only contents scope, so the job asks for it explicitly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check workflow governance
        run: node scripts/check-workflow-governance.js

      # `main` requires verified signatures, so an unsigned commit cannot be
      # merged. Until this step existed, that verdict arrived only when the
      # merge button was pressed -- after every other required check had gone
      # green -- and the fix was a branch rewrite. Report it here instead, on
      # the pull request, next to the commits that need signing.
      - name: Check commit signatures
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" --paginate --slurp \
            > commits.json
          node scripts/check-pr-signatures.js commits.json "${PR_COMMIT_COUNT}"

      # #4006: a defect fix must point at the regression test that pins the
      # failure mode, or carry a documented waiver. The issue-numbered test
      # convention existed but nothing enforced the link, so a `fix(...)` change
      # could close its issue with no test at all and pass every other gate.
      # The declaration lives in the pull request body; this step reads it and
      # refuses a fix that names nothing.
      - name: Check issue-to-regression-test traceability
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pull-request.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --slurp \
            > pull-request-files.json
          node scripts/check-issue-regression-traceability.js pull-request.json pull-request-files.json
