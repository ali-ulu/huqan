name: Windows corrupt DB probe

on:
  push:
    branches:
      - chore/codeql-pr2762-probe

permissions:
  contents: read

jobs:
  corrupt-db:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    steps:
      - name: Checkout PR 2770 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 480449a6e0294ea65767dd60489d932aaadc931f
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        shell: bash
        run: npm ci --include=optional
      - name: Reproduce corrupt DB fault test
        shell: bash
        run: node --test test/faults/corrupt-db.test.js
