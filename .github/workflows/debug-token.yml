name: Debug NPM token shape

# TEMPORARY diagnostic: prints the shape of secrets.NPM_TOKEN (length,
# JSON-escaped form, and any characters outside [a-z0-9_] which would make
# the Authorization header illegal). The token value itself is masked by
# GitHub. Delete after diagnosis.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Inspect token shape
        run: |
          node -e '
            const t = process.env.NODE_AUTH_TOKEN || "";
            console.log("len=" + t.length);
            console.log("escaped=" + JSON.stringify(t));
            const bad = [];
            for (let i = 0; i < t.length; i++) {
              const c = t[i];
              if (!/[a-z0-9_]/.test(c)) bad.push(i + ":" + c.charCodeAt(0));
            }
            console.log("nonAlnum=" + (bad.join(",") || "none"));
            if (t.length) console.log("lastCharCode=" + t.charCodeAt(t.length - 1));
          '
