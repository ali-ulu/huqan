name: Apply V4 B2B scope amendment on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/v4-b2b-scope-amendment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run checked-in amendment script
        env:
          BASE_SHA: 6a16a40cd13bf69e125fa30726baa3e0ac085d2b
          BRANCH_NAME: docs/v4-b2b-scope-amendment
        run: |
          sed -n '/^        run: |$/,$p' .github/workflows/apply-v4-b2b-scope-amendment.yml \
            | tail -n +2 \
            | sed 's/^          //' > /tmp/apply-v4-b2b-scope.sh
          sed -i '/rm \.github\/workflows\/apply-v4-b2b-scope-amendment\.yml/a rm .github/workflows/apply-v4-b2b-scope-amendment-pr.yml' /tmp/apply-v4-b2b-scope.sh
          bash /tmp/apply-v4-b2b-scope.sh
