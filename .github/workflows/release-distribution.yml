name: Release Distribution

# Distribution starts only after the canonical npm publish workflow completed.
# The job-level gate below further requires that the upstream run was a real
# tag-push release, never a manual dry run.
on:
  workflow_run:
    workflows:
      - Publish to npm
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-distribution-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify release source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.authority.outputs.tag }}
      version: ${{ steps.authority.outputs.version }}
      image: ${{ steps.authority.outputs.image }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate release authority
        id: authority
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          image="ghcr.io/${REPOSITORY,,}"

          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"

          tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [ "${tag_sha}" != "${SOURCE_SHA}" ]; then
            echo "::error::Release tag ${tag} resolves to ${tag_sha}, not upstream published commit ${SOURCE_SHA}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::Published commit ${SOURCE_SHA} is not on ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  container:
    name: Publish GHCR image
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build the exact image that will be pushed
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          VERSION: ${{ needs.verify-source.outputs.version }}
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .

      - name: Smoke-test release image before registry write
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            --name "huqan-release-smoke-${GITHUB_RUN_ID}" \
            -e HUQAN_API_KEY=release-smoke-only \
            -p 127.0.0.1:18080:3000 \
            "${IMAGE}:${VERSION}")"

          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_status="starting"
          for _ in $(seq 1 45); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}" 2>/dev/null || true)"
            if [ "${health_status}" = "healthy" ]; then break; fi
            if [ "${health_status}" = "unhealthy" ]; then
              echo "Container healthcheck reported unhealthy." >&2
              exit 1
            fi
            sleep 2
          done
          test "${health_status}" = "healthy"

          curl --fail --silent --show-error http://127.0.0.1:18080/health
          docker exec "${container_id}" sh -c \
            '! command -v python3 && ! command -v g++ && test "$(id -u)" -ne 0 && test -w /app/data'

      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push tested image
        id: push
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

          repo_digest="$(docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -v image="${IMAGE}@" 'index($0, image) == 1 { print; exit }')"
          digest="${repo_digest#*@}"

          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve pushed image digest from ${repo_digest:-<empty>}." >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${IMAGE}:${VERSION}@${digest}"

      - name: Attest pushed container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.verify-source.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  github-release:
    name: Publish GitHub Release
    needs:
      - verify-source
      - container
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download SBOM from canonical npm publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name sbom-cyclonedx \
            --dir release-artifacts

      - name: Publish release with generated notes and SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-source.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t sboms < <(find release-artifacts -maxdepth 2 -type f -name 'huqan-*.cdx.json' -print)
          if [ "${#sboms[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one CycloneDX SBOM artifact, found ${#sboms[@]}." >&2
            exit 1
          fi
          sbom="${sboms[0]}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to recreate or mutate it."
            exit 0
          fi

          gh release create "${TAG}" "${sbom}#CycloneDX SBOM" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG}"
