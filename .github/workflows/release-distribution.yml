name: Release Distribution

# Distribution starts only after the canonical npm publish workflow completed.
# The job-level gate below further requires that the upstream run was a real
# tag-push release, never a manual dry run.
on:
  workflow_run:
    workflows:
      - Publish to npm
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-distribution-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify release source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.authority.outputs.tag }}
      version: ${{ steps.authority.outputs.version }}
      image: ${{ steps.authority.outputs.image }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
    permissions:
      contents: read
    steps:
      # workflow_run is a privileged trigger. Never checkout its head_sha
      # before proving that SHA is reviewed release source on the default branch.
      - name: Checkout trusted default branch for release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate release authority
        id: authority
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          image="ghcr.io/${REPOSITORY,,}"

          # Fetch only trusted release authority first. The workflow_run SHA is
          # treated as data until it is proven to be a commit on the reviewed
          # default-branch history.
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if ! printf '%s' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Upstream workflow reported an invalid commit SHA." >&2
            exit 1
          fi

          if ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Published commit ${SOURCE_SHA} is not present on fetched ${DEFAULT_BRANCH} history." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::Published commit ${SOURCE_SHA} is not on ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          # Only after the ancestry check may bytes from SOURCE_SHA influence
          # release metadata. Parse package.json as data; do not execute source
          # code from the upstream checkout.
          version="$(git show "${SOURCE_SHA}:package.json" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const pkg = JSON.parse(input);
              if (typeof pkg.version !== "string" || pkg.version.length === 0) process.exit(1);
              process.stdout.write(pkg.version);
            });
          ')"
          tag="v${version}"

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [ "${tag_sha}" != "${SOURCE_SHA}" ]; then
            echo "::error::Release tag ${tag} resolves to ${tag_sha}, not upstream published commit ${SOURCE_SHA}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  container:
    name: Publish GHCR image
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build the exact image that will be pushed
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          VERSION: ${{ needs.verify-source.outputs.version }}
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .

      - name: Smoke-test release image before registry write
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            --name "huqan-release-smoke-${GITHUB_RUN_ID}" \
            -e HUQAN_API_KEY=release-smoke-only \
            -p 127.0.0.1:18080:3000 \
            "${IMAGE}:${VERSION}")"

          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_status="starting"
          for _ in $(seq 1 45); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}" 2>/dev/null || true)"
            if [ "${health_status}" = "healthy" ]; then break; fi
            if [ "${health_status}" = "unhealthy" ]; then
              echo "Container healthcheck reported unhealthy." >&2
              exit 1
            fi
            sleep 2
          done
          test "${health_status}" = "healthy"

          curl --fail --silent --show-error http://127.0.0.1:18080/health
          docker exec "${container_id}" sh -c \
            '! command -v python3 && ! command -v g++ && test "$(id -u)" -ne 0 && test -w /app/data'

      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push tested image
        id: push
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

          repo_digest="$(docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -v image="${IMAGE}@" 'index($0, image) == 1 { print; exit }')"
          digest="${repo_digest#*@}"

          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve pushed image digest from ${repo_digest:-<empty>}." >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${IMAGE}:${VERSION}@${digest}"

      # #3078: keyless Sigstore signature over the pushed digest, verified in
      # the same job before anything downstream runs. The registry tag is
      # mutable, so the signature is made and verified against the digest,
      # never the tag. cosign signs with the GitHub OIDC identity of this
      # exact workflow run, so a consumer can pin the issuer and the identity
      # regexp in their verify command. The provenance attestation below rides
      # the same trust chain: one more independently verifiable artifact, not
      # a substitute for the signature.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image (keyless, digest-based)
        id: sign
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} with the keyless Sigstore identity of this workflow run."

      - name: Verify the signature before the job may report success
        shell: bash
        env:
          IMAGE: ${{ needs.verify-source.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Attest pushed container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.verify-source.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  github-release:
    name: Publish GitHub Release
    needs:
      - verify-source
      - container
    runs-on: ubuntu-latest
    # #3068: attestations: read lets the job independently re-check the repo's
    # attestation records while verifying the SBOM's Sigstore bundle locally
    # (gh attestation verify --bundle needs no credential mint) before the
    # signature file is published as a release asset.
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Download SBOM and attestation bundle from canonical npm publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name sbom-cyclonedx \
            --dir release-artifacts
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name sbom-attestation-bundle \
            --dir release-artifacts

      - name: Publish release with generated notes and SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-source.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t sboms < <(find release-artifacts -maxdepth 2 -type f -name 'huqan-*.cdx.json' -print)
          if [ "${#sboms[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one CycloneDX SBOM artifact, found ${#sboms[@]}." >&2
            exit 1
          fi
          sbom="${sboms[0]}"

          # #3068: the release must carry a verifiable signature, not only
          # downloadable bytes. The upstream publish run exported the Sigstore
          # bundle for the SBOM attestation; verify the SBOM against it before
          # publishing either file, so an unsigned release can never be created.
          mapfile -t bundles < <(find release-artifacts -type f \( -name '*.sigstore' -o -name '*.sigstore.json' \) -print)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Sigstore attestation bundle artifact, found ${#bundles[@]}." >&2
            exit 1
          fi
          # gh >= 2.9x refuses a --bundle whose name does not end in .json or
          # .jsonl ("bundle file extension not supported"); that stopped the
          # v0.13.2 GitHub release. Publish runs up to v0.13.2 exported a bare
          # .sigstore file, so normalise the name here rather than trusting it.
          bundle="${bundles[0]}"
          if [[ "${bundle}" != *.json ]]; then
            cp "${bundle}" "${bundle%.sigstore}.sigstore.json"
            bundle="${bundle%.sigstore}.sigstore.json"
          fi
          if ! gh attestation verify "${sbom}" --bundle "${bundle}" --repo "${GITHUB_REPOSITORY}" >/dev/null; then
            echo "::error::SBOM failed Sigstore bundle verification; refusing to publish a release whose signature does not check out." >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to recreate or mutate it."
            exit 0
          fi

          gh release create "${TAG}" "${sbom}#CycloneDX SBOM" "${bundle}#SBOM Sigstore attestation bundle" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG}"
