name: PR Branch Sync Helper

on:
  push:
    branches:
      - chore/pr-sync-helper

permissions:
  contents: write

jobs:
  sync:
    name: Sync chore/github-actions-refresh-v2 with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/github-actions-refresh-v2
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current main into target branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:chore/github-actions-refresh-v2
