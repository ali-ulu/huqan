name: Workflow BDD Contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-bdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

jobs:
  bdd-contract:
    name: Validate BDD/Gherkin contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workflow feature files
        run: python3 scripts/validate_workflow_gherkin.py

      - name: Report BDD scenario inventory
        run: |
          echo "Feature files:"
          find test/bdd/workflows -maxdepth 1 -type f -name '*.feature' -print | sort
          echo "Scenario count:"
          grep -Rho '^  Scenario\( Outline\)\?:' test/bdd/workflows/*.feature | wc -l
          echo "Acceptance-tag count:"
          grep -Rho '@ac-[0-9-]*' test/bdd/workflows/*.feature | sort -u | wc -l

  node-tests:
    name: Node.js tests (Node ${{ matrix.node-version }})
    needs: bdd-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Same policy as benchmark.yml, which is now a single leg: Node 20 is
        # end-of-life and the package declares engines >=22.13.0. Keeping the
        # two workflows on one policy avoids a pull request that is green here
        # and red there.
        node-version: ['22']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # actions/checkout only creates a remote-tracking ref for the ref it
      # checked out, so `origin/main` does not resolve here. The agent-context
      # guard in test/agent-context.test.js validates live Git state against
      # origin/main and fails closed without it, so fetch the baseline branch
      # explicitly before running the suite.
      - name: Fetch baseline branch for live Git validation
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # Pull-request checkouts are detached by design. Name the checked-out
      # commit so live Git validation has branch identity as evidence; this
      # does not alter the commit or weaken the ancestry check.
      - name: Name checked-out branch for live Git validation
        env:
          HUQAN_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git switch --create "$HUQAN_CI_BRANCH" "$GITHUB_SHA"
      # GitHub can materialize the pull-request merge ref before a newer main
      # commit lands. Merge the fetched baseline into this ephemeral test
      # branch so live validation measures the same current ancestry, while a
      # real merge conflict still fails the job.
      - name: Materialize current baseline ancestry for live Git validation
        if: github.event_name == 'pull_request'
        run: git merge --no-edit origin/main

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Run repository test suite
        run: npm test
        env:
          # Same policy as benchmark.yml: AC-785-10 is only proven when the
          # browser smoke actually runs, so fail instead of skipping. The
          # conditional this replaced exempted Node 20, which has no global
          # WebSocket; that leg is gone.
          HUQAN_REQUIRE_BROWSER_SMOKE: '1'
