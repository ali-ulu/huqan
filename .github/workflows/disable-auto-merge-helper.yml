name: Disable Auto Merge Helper

on:
  push:
    branches:
      - chore/disable-auto-merge-helper

permissions:
  contents: read
  pull-requests: write

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge on policy-controlled PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
            -F id='PR_kwDOTYucQM8AAAABEjo3ZQ'
