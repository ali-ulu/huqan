name: OpenSSF Scorecard

# Scores the repository against the OpenSSF supply-chain checks (pinned
# dependencies, token permissions, branch protection, signed releases, SAST,
# fuzzing, ...) and publishes the result to the public Scorecard API, which is
# what the README badge reads. Findings also land in the Security tab.
#
# publish_results imposes restrictions this file must keep: no top-level write
# permissions, no env or defaults blocks, and only approved actions in the job.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
