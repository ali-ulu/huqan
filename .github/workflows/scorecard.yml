name: OpenSSF Scorecard

# Scores the repository against the OpenSSF supply-chain checks (pinned
# dependencies, token permissions, branch protection, signed releases, SAST,
# fuzzing, ...) and publishes the result to the public Scorecard API, which is
# what the README badge reads. Findings also land in the Security tab.
#
# publish_results imposes restrictions this file must keep: no top-level write
# permissions, no env or defaults blocks, and only approved actions in the job.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
