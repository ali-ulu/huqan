name: Architecture Checks

on:
  # No base-branch filter: see the note in security.yml. A pull request based on
  # a feature branch skipped both jobs below and still showed "All checks have
  # passed" (#681).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Keep one current PR run per workflow; a new push supersedes stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  import-cycles:
    name: Require graph is acyclic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # No dependencies needed: the checker only reads the source tree.
      - name: Check for require cycles
        run: node scripts/check-import-cycles.js

  file-size:
    name: Enforce the large-file threshold
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Ratchet, not a flat limit (#328): files at or under the threshold must
      # stay there, and the files already over it may not grow. Reads the
      # source tree only, so no dependencies are needed.
      - name: Check file sizes
        run: node scripts/check-file-size.js

  module-boundary:
    name: Forbid cross-module private access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # docs/architecture-policy.md §4. Reaching into another object's
      # `_private` member makes that member the real contract between the two
      # modules while it keeps the marking that says it is not one — no
      # documentation, no direct test, no stability promise. That is why
      # refactors here kept breaking callers nobody had reason to look at.
      # Ratcheted like file sizes: the recorded count may fall, never rise.
      # Reads the source tree only, so no dependencies are needed.
      - name: Check module boundaries
        run: node scripts/check-module-boundary.js

  layers:
    name: Enforce dependency direction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # docs/architecture-policy.md §3: entrypoint -> domain -> storage, with
      # shared helpers below all three. An upward edge drags an HTTP server or
      # a CLI into consumers that wanted neither, and makes the lower layer
      # impossible to exercise on its own. Exceptions are listed in the script
      # with a review date, and an expired one fails exactly like a new edge.
      # Reads the source tree only, so no dependencies are needed.
      - name: Check layer directions
        run: node scripts/check-layers.js

  control-chars:
    name: Forbid raw control characters in tracked sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # #1042: a raw control byte makes git classify a source file as binary,
      # so its changes render as `Bin X -> Y bytes` with no line diff and grep
      # reports only "binary file matches" — the file drops out of review and
      # out of every codebase-wide search. Reads the source tree only, so no
      # dependencies are needed.
      - name: Check for raw control characters
        run: node scripts/check-control-chars.js

  doc-status:
    name: Require every V5 document to declare its status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # #295: the V5 set holds shipped work, authorized specifications and
      # directions nobody has authorized, written in the same voice. Each
      # document declares which it is; this fails when one does not. Reads the
      # docs tree only, so no dependencies are needed.
      - name: Check V5 document status declarations
        run: node scripts/check-doc-status.js

  docs-drift:
    name: Require living documentation to agree with the source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Unlike its sibling jobs this one does need the dependencies installed:
      # the checker reads the operator tool names off mcpServer.js, and loading
      # that module pulls in the kernel and its runtime requires. Without this
      # step the job dies on `Cannot find module 'proper-lockfile'` before it
      # reaches a single document.
      - name: Install dependencies
        run: npm ci

      # #1782 and its class: in a governance product the documentation is part
      # of the trust surface, so a documented Node floor, tool name, route or
      # file path the source contradicts is a false claim about the product,
      # not a typo. Fixing them one at a time is why they kept coming back.
      - name: Check documentation against the source
        run: node scripts/check-docs-drift.js

  lint:
    name: Enforce a lint-clean tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The linter needs the oxlint binary, which is a devDependency.
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
