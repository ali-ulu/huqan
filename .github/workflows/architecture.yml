name: Architecture Checks

on:
  # No base-branch filter: see the note in security.yml. A pull request based on
  # a feature branch skipped both jobs below and still showed "All checks have
  # passed" (#681).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-cycles:
    name: Require graph is acyclic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      # No dependencies needed: the checker only reads the source tree.
      - name: Check for require cycles
        run: node scripts/check-import-cycles.js

  file-size:
    name: Enforce the large-file threshold
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      # Ratchet, not a flat limit (#328): files at or under the threshold must
      # stay there, and the files already over it may not grow. Reads the
      # source tree only, so no dependencies are needed.
      - name: Check file sizes
        run: node scripts/check-file-size.js

  doc-status:
    name: Require every V5 document to declare its status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      # #295: the V5 set holds shipped work, authorized specifications and
      # directions nobody has authorized, written in the same voice. Each
      # document declares which it is; this fails when one does not. Reads the
      # docs tree only, so no dependencies are needed.
      - name: Check V5 document status declarations
        run: node scripts/check-doc-status.js
