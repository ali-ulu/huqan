name: Architecture Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-cycles:
    name: Require graph is acyclic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # No dependencies needed: the checker only reads the source tree.
      - name: Check for require cycles
        run: node scripts/check-import-cycles.js
