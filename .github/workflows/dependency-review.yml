name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**/package.json'
      - 'packages/**/package-lock.json'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Held at the same floor as security.yml (#3008): both can run on one
          # pull request, so a lower value here would let a moderate finding
          # through the lockfile-specific review while the broad review failed it.
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: true
          show-openssf-scorecard: true
