name: PR198 owner JSON budget patch

on:
  push:
    branches:
      - feat/external-client-mutation-receipt-owner-0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/external-client-mutation-receipt-owner-0
          fetch-depth: 0
      - name: Apply exact bounded snapshot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          owner_path = Path('lib/external-client-mutation-receipt-owner.js')
          owner = owner_path.read_text()

          old_prefix = """function copyDeterministicJson(value, state = { depth: 0, nodes: 0, seen: new WeakSet() }) {
            if (value === null || typeof value === 'string' || typeof value === 'boolean') return value;
          """
          new_prefix = """function copyDeterministicJson(value, state = {
            depth: 0,
            budget: { nodes: 0 },
            seen: new WeakSet(),
          }) {
            state.budget.nodes += 1;
            if (state.budget.nodes > 10000) {
              throw new TypeError('JSON structure is unbounded or circular');
            }
            if (value === null || typeof value === 'string' || typeof value === 'boolean') return value;
          """
          if owner.count(old_prefix) != 1:
            raise SystemExit('owner prefix did not match exactly once')
          owner = owner.replace(old_prefix, new_prefix, 1)

          old_guard = "if (state.depth >= 32 || state.nodes >= 10000 || state.seen.has(value)) {"
          new_guard = "if (state.depth >= 32 || state.seen.has(value)) {"
          if owner.count(old_guard) != 1:
            raise SystemExit('owner depth guard did not match exactly once')
          owner = owner.replace(old_guard, new_guard, 1)

          old_increment = "  state.nodes += 1;\n"
          if owner.count(old_increment) != 1:
            raise SystemExit('owner node increment did not match exactly once')
          owner = owner.replace(old_increment, '', 1)
          owner_path.write_text(owner)

          test_path = Path('lib/external-client-mutation-receipt-owner.test.js')
          tests = test_path.read_text()
          marker = "aggregate JSON node budget rejects oversized sibling structures before mutation"
          if marker in tests:
            raise SystemExit('budget test already exists')
          tests += """

test('aggregate JSON node budget rejects oversized sibling structures before mutation', (t) => {
  const { graph } = graphFixture(t);
  const pkg = packageFixture();
  pkg.metadata.padding = Array.from({ length: 10001 }, (_, index) => index);

  expectCode(
    () => commitExternalClientCandidateClaim(pkg, contextFixture(pkg), { graph }),
    EXTERNAL_CLIENT_MUTATION_RECEIPT_OWNER_ERRORS.INPUT_INVALID,
  );
  assert.equal(graph.getCandidateClaims({ workspaceId: WORKSPACE_ID }).length, 0);
  assert.equal(graph._db.prepare('SELECT COUNT(*) AS count FROM mutation_journal').get().count, 0);
  assert.equal(graph._db.prepare('SELECT COUNT(*) AS count FROM mutation_receipts').get().count, 0);
});
"""
          test_path.write_text(tests)

          workflow = Path('.github/workflows/pr198-owner-budget-patch.yml')
          workflow.unlink()
          PY
      - name: Verify exact final scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'lib/external-client-mutation-receipt-owner.js\nlib/external-client-mutation-receipt-owner.test.js'
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound external client JSON snapshots'
          git push origin HEAD:feat/external-client-mutation-receipt-owner-0
