name: Security Checks

on:
  # Deliberately unfiltered by base branch. `branches: [main]` here meant a
  # stacked pull request -- one opened against another feature branch -- never
  # triggered this workflow at all, and GitHub reported the result as "All
  # checks have passed", because everything that ran did pass. The scan simply
  # never ran (#681). npm audit, gitleaks and Semgrep are fail-closed gates;
  # they cost a few CI minutes on the stacked head and stay silent otherwise.
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  # Security checks job
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    # Every step below is load-bearing: a failure here must fail the job.
    # This workflow previously ended each command with `|| echo "...continuing"`
    # and probed for gitleaks/semgrep with `command -v`. Neither tool ships on
    # ubuntu-latest, so secret scanning never actually ran and the job stayed
    # green regardless of findings (#364, #365).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed commit range, so it needs full history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      # gitleaks-action is free for public repositories and needs no license
      # key. If this repo ever goes private, GITLEAKS_LICENSE must be set or
      # this step fails closed -- which is the intended behavior.
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis (Semgrep)
        run: |
          python3 -m pip install --quiet --user 'semgrep>=1.60,<2'
          "$(python3 -m site --user-base)/bin/semgrep" scan \
            --config p/javascript \
            --config p/secrets \
            --error \
            --quiet \
            --metrics off

      - name: Check for sensitive files
        run: |
          if [[ -f SECURITY.md ]]; then
            echo "SECURITY.md exists - checking structure"
          fi
          if [[ -f THREAT_MODEL.md ]]; then
            echo "THREAT_MODEL.md exists - checking structure"
          fi

      - name: Create security report
        if: failure()
        run: |
          echo "Security checks completed" > security-report.txt
          echo "Review the logs above for details." >> security-report.txt
