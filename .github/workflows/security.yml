name: Security Checks

on:
  # Deliberately unfiltered by base branch. `branches: [main]` here meant a
  # stacked pull request -- one opened against another feature branch -- never
  # triggered this workflow at all, and GitHub reported the result as "All
  # checks have passed", because everything that ran did pass. The scan simply
  # never ran (#681). npm audit, gitleaks and Semgrep are fail-closed gates;
  # they cost a few CI minutes on the stacked head and stay silent otherwise.
  pull_request:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Do not spend a runner on an obsolete security scan after a new PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Security checks job
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    # Every step below is load-bearing: a failure here must fail the job.
    # This workflow previously ended each command with `|| echo "...continuing"`
    # and probed for gitleaks/semgrep with `command -v`. Neither tool ships on
    # ubuntu-latest, so secret scanning never actually ran and the job stayed
    # green regardless of findings (#364, #365).
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the pushed commit range, so it needs full history.
          fetch-depth: 0

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
          show-patched-versions: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      # gitleaks-action is free for public repositories and needs no license
      # key. If this repo ever goes private, GITLEAKS_LICENSE must be set or
      # this step fails closed -- which is the intended behavior.
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis (Semgrep)
        run: |
          # Exact version, not a range (#751): a newly published release inside
          # a range changes code executed by this privileged job with no
          # repository diff. Bump deliberately.
          python3 -m pip install --quiet --user 'semgrep==1.173.0'
          "$(python3 -m site --user-base)/bin/semgrep" scan \
            --config p/javascript \
            --config p/secrets \
            --error \
            --quiet \
            --metrics off

      - name: Check for sensitive files
        run: |
          if [[ -f SECURITY.md ]]; then
            echo "SECURITY.md exists - checking structure"
          fi
          if [[ -f THREAT_MODEL.md ]]; then
            echo "THREAT_MODEL.md exists - checking structure"
          fi

      - name: Create security report
        if: failure()
        run: |
          echo "Security checks completed" > security-report.txt
          echo "Review the logs above for details." >> security-report.txt
