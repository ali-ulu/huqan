name: Main CI Watch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: main-ci-watch
  cancel-in-progress: true

jobs:
  inspect-main:
    name: Inspect recent main CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run transient failures once, then alert on persistent red commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t shas < <(
            gh api "repos/$REPO/commits?sha=main&per_page=10" --jq '.[].sha'
          )

          alerts=0
          latest_sha="${shas[0]}"

          latest_state="$(
            gh api "repos/$REPO/actions/runs?head_sha=$latest_sha&per_page=100" \
              --jq '
                [
                  .workflow_runs
                  | select(.name != "Main CI Watch")
                ]
                | group_by(.name)
                | map(max_by([.run_number, .run_attempt]))
              '
          )"

          latest_count="$(jq 'length' <<<"$latest_state")"
          latest_blocking="$(
            jq '[
              .[]
              | select(
                  .status != "completed"
                  or (
                    .conclusion != "success"
                    and .conclusion != "skipped"
                    and .conclusion != "neutral"
                  )
                )
            ] | length' <<<"$latest_state"
          )"

          latest_committed_at="$(
            gh api "repos/$REPO/commits/$latest_sha" --jq '.commit.committer.date'
          )"
          latest_epoch="$(date -d "$latest_committed_at" +%s)"
          now_epoch="$(date -u +%s)"
          settled=false
          if (( now_epoch - latest_epoch >= 300 )); then
            settled=true
          fi

          main_green=false
          if [[ "$settled" == "true" && "$latest_count" -gt 0 && "$latest_blocking" -eq 0 ]]; then
            main_green=true
          fi

          for sha in "${shas[@]}"; do
            short="${sha:0:7}"

            failures="$(
              gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
                --jq '
                  [
                    .workflow_runs
                    | group_by(.name)[]
                    | max_by([.run_number, .run_attempt])
                    | select(
                        .status == "completed"
                        and (
                          .conclusion == "failure"
                          or .conclusion == "cancelled"
                          or .conclusion == "timed_out"
                          or .conclusion == "action_required"
                          or .conclusion == "startup_failure"
                        )
                      )
                    | {
                        id,
                        name,
                        conclusion,
                        run_number,
                        run_attempt,
                        html_url
                      }
                  ]
                '
            )"

            count="$(jq 'length' <<<"$failures")"
            if [[ "$count" -eq 0 ]]; then
              echo "$short: no current failed/cancelled workflow."
              continue
            fi

            rerunnable="$(jq '[.[] | select(.run_attempt == 1 and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure"))]' <<<"$failures")"
            rerun_count="$(jq 'length' <<<"$rerunnable")"

            if [[ "$rerun_count" -gt 0 ]]; then
              while IFS= read -r run_id; do
                echo "$short: re-running failed jobs for workflow run $run_id once."
                gh api --method POST "repos/$REPO/actions/runs/$run_id/rerun-failed-jobs"
              done < <(jq -r '.[].id' <<<"$rerunnable")
              continue
            fi

            title="ci(main): $short has failing workflow(s)"
            existing="$(
              gh issue list \
                --repo "$REPO" \
                --state open \
                --search "$short in:title" \
                --json number,title \
                --jq '.[] | select(.title == "'"$title"'") | .number' \
                | head -n 1
            )"

            if [[ -n "$existing" ]]; then
              echo "$short: alert issue #$existing already exists."
              continue
            fi

            {
              echo "Main commit \`$sha\` has completed workflow failures."
              echo
              echo "Commit: https://github.com/$REPO/commit/$sha"
              echo
              echo "### Current failing workflows"
              jq -r '.[] | "- **\(.name)**: \(.conclusion) ([run #\(.run_number), attempt \(.run_attempt)](\(.html_url)))"' <<<"$failures"
              echo
              echo "_Created automatically by the repository-native Main CI Watch workflow. The watcher scans the latest 10 main commits, automatically re-runs eligible failed jobs once, and opens an issue only when the failure persists or cannot be safely re-run._"
            } > /tmp/main-ci-watch.md

            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body-file /tmp/main-ci-watch.md

            alerts=$((alerts + 1))
          done

          if [[ "$main_green" == "true" ]]; then
            mapfile -t resolved_issues < <(
              gh issue list \
                --repo "$REPO" \
                --state open \
                --limit 100 \
                --json number,title,body \
                --jq '.[] | select(
                  (.title | startswith("ci(main): "))
                  and (.body | contains("Created automatically by the repository-native Main CI Watch workflow"))
                ) | .number'
            )

            for issue_number in "${resolved_issues[@]}"; do
              gh issue comment "$issue_number" \
                --repo "$REPO" \
                --body "Current main \`$latest_sha\` is fully green across its latest workflow attempts. Closing this CI alert."
              gh issue close "$issue_number" --repo "$REPO" --reason completed
            done
          else
            echo "Current main is not fully green or has not settled for 5 minutes; CI alert issues remain open."
          fi

          echo "Scanned ${#shas[@]} recent main commits; opened $alerts new alert issue(s)."
