name: Main CI Watch

on:
  # #3663: the 15-minute schedule below never ran on cadence. GitHub delays and
  # drops scheduled runs under load, and this watcher's own history shows gaps
  # of 3-7 hours, so a red main went unseen for most of a working day. The
  # watcher therefore also runs when a workflow that runs on main completes.
  # A workflow_run event fires after that run has finished, so the watcher
  # still never inspects or reruns a run that is in progress; runs still in
  # flight for the same commit read as PENDING and keep main from being called
  # green. There is no branch filter: a tag-triggered Publish run carries the
  # tag as its branch and must still raise an alert (#3331).
  workflow_run:
    workflows:
      - Benchmark Regression
      - API Contract
      - Publish to npm
      - Repo Radar Contract
    types: [completed]
  schedule:
    # The fallback when nothing completes on a quiet main, so re-runs and alert
    # closures still happen. Every 15 minutes, not hourly: #3262 left `npm
    # test` red on main for ~50 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-watch
  # Queue rather than cancel: with event triggers a newer run would otherwise
  # cancel one that is part-way through re-running jobs or opening an alert.
  # GitHub keeps one pending run per group, so a burst still collapses.
  cancel-in-progress: false

jobs:
  inspect-main:
    name: Inspect recent main CI
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    # A pull request's Benchmark Regression / API Contract run also completes
    # as a workflow_run event; it says nothing about main.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    # Up to five minutes of settle wait plus the scan of ten commits.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/main-ci-watch-contexts.json
            scripts/main-ci-watch-state.js
          sparse-checkout-cone-mode: false
      - name: Re-run transient failures once, then alert on persistent red commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t shas < <(
            gh api "repos/$REPO/commits?sha=main&per_page=10" --jq '.[].sha'
          )

          alerts=0
          latest_sha="${shas[0]}"

          for sha in "${shas[@]}"; do
            short="${sha:0:7}"

            failures="$(
              gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
                --jq '
                  [
                    .workflow_runs
                    | map(select(.name != "Main CI Watch"))
                    | group_by(.name)[]
                    | max_by([.run_number, .run_attempt])
                    | select(
                        .status == "completed"
                        and (
                          .conclusion == "failure"
                          or .conclusion == "cancelled"
                          or .conclusion == "timed_out"
                          or .conclusion == "action_required"
                          or .conclusion == "startup_failure"
                        )
                      )
                    | {
                        id,
                        name,
                        conclusion,
                        run_number,
                        run_attempt,
                        html_url
                      }
                  ]
                '
            )"

            # A cancelled run with zero jobs never reached repository code. This
            # is infrastructure/supersession noise, not a product or benchmark
            # failure, so do not rerun it or open a CI incident for it.
            filtered_failures='[]'
            while IFS= read -r failure; do
              run_id="$(jq -r '.id' <<<"$failure")"
              conclusion="$(jq -r '.conclusion' <<<"$failure")"

              if [[ "$conclusion" == "cancelled" ]]; then
                jobs_count="$(
                  gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count'
                )"
                if [[ "$jobs_count" -eq 0 ]]; then
                  echo "$short: workflow run $run_id was cancelled before any job started; ignoring as superseded/infrastructure cancellation."
                  continue
                fi
              fi

              filtered_failures="$(
                jq --argjson failure "$failure" '. + [$failure]' <<<"$filtered_failures"
              )"
            done < <(jq -c '.[]' <<<"$failures")

            failures="$filtered_failures"
            count="$(jq 'length' <<<"$failures")"
            if [[ "$count" -eq 0 ]]; then
              echo "$short: no actionable failed/cancelled workflow."
              continue
            fi

            rerunnable="$(jq '[.[] | select(.run_attempt == 1 and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure"))]' <<<"$failures")"
            rerun_count="$(jq 'length' <<<"$rerunnable")"

            if [[ "$rerun_count" -gt 0 ]]; then
              while IFS= read -r run_id; do
                echo "$short: re-running failed jobs for workflow run $run_id once."
                gh api --method POST "repos/$REPO/actions/runs/$run_id/rerun-failed-jobs"
              done < <(jq -r '.[].id' <<<"$rerunnable")
              continue
            fi

            title="ci(main): $short has failing workflow(s)"
            existing="$(
              gh issue list \
                --repo "$REPO" \
                --state open \
                --search "$short in:title" \
                --json number,title \
                --jq '.[] | select(.title == "'"$title"'") | .number' \
                | head -n 1
            )"

            if [[ -n "$existing" ]]; then
              echo "$short: alert issue #$existing already exists."
              continue
            fi

            # Alert once per SHA (#3822-#3824): an earlier watcher run already
            # surfaced this commit's failures and that issue was closed when
            # main went green. Runs are immutable, so the same failed attempt
            # would otherwise re-open an identical alert on every later
            # non-green verdict while the commit stays in the 10-commit
            # window. A closed watcher issue for the exact title blocks the
            # duplicate; genuinely new runs on the same SHA stay visible in
            # the Actions UI.
            existing_closed="$(
              gh issue list \
                --repo "$REPO" \
                --state closed \
                --search "$short in:title" \
                --json number,title,body \
                --jq '.[] | select(.title == "'"$title"'") | select(.body | contains("Created automatically by the repository-native Main CI Watch workflow")) | .number' \
                | head -n 1
            )"

            if [[ -n "$existing_closed" ]]; then
              echo "$short: already alerted in #$existing_closed; not re-opening."
              continue
            fi

            {
              echo "Main commit \`$sha\` has completed workflow failures."
              echo
              echo "Commit: https://github.com/$REPO/commit/$sha"
              echo
              echo "### Current failing workflows"
              jq -r '.[] | "- **\(.name)**: \(.conclusion) ([run #\(.run_number), attempt \(.run_attempt)](\(.html_url)))"' <<<"$failures"
              echo
              echo "_Created automatically by the repository-native Main CI Watch workflow. The watcher scans the latest 10 main commits, automatically re-runs eligible failed jobs once, and opens an issue only when the failure persists or cannot be safely re-run._"
            } > /tmp/main-ci-watch.md

            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body-file /tmp/main-ci-watch.md

            alerts=$((alerts + 1))
          done

          # #3662: main is green only when every post-merge check the ruleset
          # requires was observed on the latest commit and passed. A check with
          # no run is MISSING, not "nothing failed"; see
          # scripts/main-ci-watch-state.js and .github/main-ci-watch-contexts.json.
          # This runs after the alert loop and tolerates its own failure: an
          # API error or a broken script only withholds green, it never stops
          # a red commit from being re-run or alerted on.
          verdict="STATE_UNAVAILABLE"
          main_green=false
          latest_committed_at="$(
            gh api "repos/$REPO/commits/$latest_sha" --jq '.commit.committer.date' || true
          )"
          if [[ -n "$latest_committed_at" ]]; then
            # An event-triggered run can arrive before the commit has settled;
            # nothing would wake the watcher again until the schedule, so wait
            # out the rest of the five-minute window here instead.
            age=$(( $(date -u +%s) - $(date -d "$latest_committed_at" +%s) ))
            if (( age >= 0 && age < 300 )); then
              echo "Latest main ${latest_sha:0:7} is ${age}s old; waiting $(( 300 - age ))s for it to settle."
              sleep $(( 300 - age ))
            fi
          fi
          if [[ -n "$latest_committed_at" ]] \
            && gh api "repos/$REPO/actions/runs?head_sha=$latest_sha&per_page=100" \
              --jq '[.workflow_runs[] | {name, status, conclusion, run_number, run_attempt}]' > /tmp/workflow-runs.json \
            && gh api --paginate "repos/$REPO/commits/$latest_sha/check-runs?per_page=100" \
              --jq '.check_runs[] | {id, name, status, conclusion}' | jq -s '.' > /tmp/check-runs.json \
            && node scripts/main-ci-watch-state.js \
              --inventory .github/main-ci-watch-contexts.json \
              --check-runs /tmp/check-runs.json \
              --workflow-runs /tmp/workflow-runs.json \
              --committed-at "$latest_committed_at" > /tmp/main-state.json; then
            verdict="$(jq -r '.verdict' /tmp/main-state.json)"
            main_green="$(jq -r '.mainGreen' /tmp/main-state.json)"
            {
              echo "### Main CI Watch: ${latest_sha:0:7} -- $verdict"
              echo
              echo "| Post-merge required check | State |"
              echo "|---|---|"
              jq -r '.contexts[] | "| \(.context) | \(.state) |"' /tmp/main-state.json
              echo
              echo "Not observable after merge, enforced on the pull request by branch protection: $(jq -r '.notObservablePostMerge | join(", ")' /tmp/main-state.json)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not compute the main CI state for ${latest_sha:0:7}; main is not called green and alerts stay open."
          fi
          echo "Latest main ${latest_sha:0:7}: $verdict"

          if [[ "$main_green" == "true" ]]; then
            mapfile -t resolved_issues < <(
              gh issue list \
                --repo "$REPO" \
                --state open \
                --limit 100 \
                --json number,title,body \
                --jq '.[] | select(
                  (.title | startswith("ci(main): "))
                  and (.body | contains("Created automatically by the repository-native Main CI Watch workflow"))
                ) | .number'
            )

            for issue_number in "${resolved_issues[@]}"; do
              gh issue comment "$issue_number" \
                --repo "$REPO" \
                --body "Current main \`$latest_sha\` has every post-merge required check observed and green ($verdict). Closing this CI alert."
              gh issue close "$issue_number" --repo "$REPO" --reason completed
            done
          else
            echo "Current main is not verified green ($verdict); CI alert issues remain open."
          fi

          echo "Scanned ${#shas[@]} recent main commits; opened $alerts new alert issue(s)."
