name: HUQAN Hourly Architecture Scan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: huqan-hourly-architecture-scan
  cancel-in-progress: false

jobs:
  scan-architecture:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Restore scan state
        uses: actions/cache@v4
        with:
          path: .huqan_automation_state.json
          key: huqan-architecture-scan-state-v2-${{ github.run_id }}
          restore-keys: |
            huqan-architecture-scan-state-v2-
            
      - name: Test deterministic scanner
        run: python3 -m unittest discover -s scripts/architecture-scan -p 'test_*.py'

      - name: Run analyzer script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/architecture-scan/analyzer.py
