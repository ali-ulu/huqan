name: Launch installed-package smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/launch-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'cli.js'
      - 'server.js'
      - 'mcpServer.js'
      - 'lib/**'
      - 'scripts/launch-installed-package-smoke.js'
      - 'scripts/verify-package-tarball.js'
      - 'test/memory-lifecycle-restore-receipt-chain.test.js'
      - 'test/memory-tombstone-supersede-downstream-exclusion.test.js'
      - 'test/memory-mutation-race-adversarial.test.js'

permissions:
  contents: read

concurrency:
  group: launch-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-package-smoke:
    name: Installed package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci --include=optional

      - name: Verify package tarball contract
        run: npm run verify:tarball

      - name: Exercise installed launch surfaces
        run: node scripts/launch-installed-package-smoke.js

      - name: Lifecycle smoke slice (memory store + receipt chain, Node 22)
        run: node --test test/memory-lifecycle-restore-receipt-chain.test.js test/memory-tombstone-supersede-downstream-exclusion.test.js test/memory-mutation-race-adversarial.test.js
