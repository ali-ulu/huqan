name: Benchmark Regression

# Conditional CI gate policy — see
# docs/refactor/refactor-4d-contract-acceptance.md §3 and §4.
#
# Three independent surfaces, each with its own (run | skip) job pair so the
# status check always appears on every PR and reports either a real result
# or NOT_APPLICABLE. Branch protection can require "npm test (runtime/test)",
# "Benchmark", and "Docker build" without blocking docs-only or
# performance-neutral PRs.
#
#   runtime/test change  →  npm test runs            (mandatory)
#   perf-sensitive       →  npm test + benchmark     (mandatory on runtime)
#   docker/package       →  docker build runs        (mandatory on docker)
#   docs-only / nothing  →  all three NOT_APPLICABLE
#
# Security Checks (security.yml) stays mandatory on every PR and is
# intentionally NOT conditionalized here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# A new push to the same PR supersedes stale classification/test work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# NOTE: This is a RESTORE placeholder - the full file will be applied in next commit
# See docs/ci/benchmark-pr-ubuntu-matrix.md for the intended one-line matrix change.
jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "branch needs full benchmark.yml restore - do not merge"
