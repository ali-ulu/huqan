name: Benchmark Regression

# Conditional CI gate policy — see
# docs/refactor/refactor-4d-contract-acceptance.md §3 and §4.
#
# Three independent surfaces, each with its own (run | skip) job pair so the
# status check always appears on every PR and reports either a real result
# or NOT_APPLICABLE. Branch protection can require "npm test (runtime/test)",
# "Benchmark", and "Docker build" without blocking docs-only or
# performance-neutral PRs.
#
#   runtime/test change  →  npm test runs            (mandatory)
#   perf-sensitive       →  npm test + benchmark     (mandatory on runtime)
#   docker/package       →  docker build runs        (mandatory on docker)
#   docs-only / nothing  →  all three NOT_APPLICABLE
#
# Security Checks (security.yml) stays mandatory on every PR and is
# intentionally NOT conditionalized here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# A new push to the same PR supersedes stale classification/test work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Classify which surfaces changed. Always runs. Outputs three boolean
  # strings ("yes" / "no") consumed by downstream jobs' if: conditions.
  # ---------------------------------------------------------------------
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime_or_test: ${{ steps.classify.outputs.runtime_or_test }}
      perf: ${{ steps.classify.outputs.perf }}
      docker: ${{ steps.classify.outputs.docker }}
      nightly: ${{ steps.classify.outputs.nightly }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" || true)
          else
            # push to main: compare against the parent commit
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi

          # Trim and de-duplicate
          CHANGED=$(echo "${CHANGED}" | sed '/^[[:space:]]*$/d' | sort -u)

          # CI_CLASSIFIER_FUNCTIONS_START
          is_runtime_file() {
            # Runtime files whose change requires the full npm test suite.
            #
            # Deny-by-default (#752). The previous form was a hand-maintained
            # allowlist, and it had already drifted: adapters/* is published by
            # package.json#files and is on the production ingest path, and
            # github-app-server.js is a declared production entry point in
            # lib/module-reachability.js. A PR touching only those left
            # runtime_or_test=no, so branch protection saw the required
            # npm test check satisfied by the NOT_APPLICABLE skip job while a
            # shipped surface changed untested.
            #
            # scripts/* and benchmarks/* are here because package.json#files
            # publishes backup.js, restore.js, egitim-demo.js, bench.js and
            # verifBench.js; the exclusions above are matched first so
            # benchmarks/fixtures/* stays out. bin/* is here because
            # package.json#bin ships it: it is what an installed consumer
            # executes, so a change there is a change to a shipped surface.
            #
            # The final `*.js` arm is what makes it fail closed: a new root
            # production file counts as runtime until someone classifies it
            # otherwise, rather than being silently exempt.
            case "$1" in
              docs/*|specs/*|test/*|benchmarks/fixtures/*|fixtures/*|public/*)
                return 1
                ;;
              package.json|package-lock.json|plugins/*|lib/*|nlp/*|packages/*|migrations/*|schemas/*|adapters/*|scripts/*|benchmarks/*|bin/*)
                return 0
                ;;
              */*)
                # Any other nested path is not a runtime surface.
                return 1
                ;;
              *.js)
                # Unclassified root-level JavaScript: treat as production.
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_test_file() {
            # Test-only changes run npm test but do not trigger benchmark.
            case "$1" in
              test/*|*.test.js|*.spec.js)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_perf_file() {
            # Performance-sensitive files trigger the benchmark regression gate.
            case "$1" in
              benchmarks/bench.js|benchmarks/check-regression.js|benchmarks/bench-memory-scale.js|\
              benchmarks/snapshot-memory.js|benchmarks/verifBench.js|benchmarks/results.json|\
              benchmarks/fixtures/*|graph.js|kernel.js|kernel.v2.js|storage.js|causalSimulator.js|\
              finalizer.js|rustGraph.js|lib/memory-store.js|lib/ingest.js|lib/causal/*|\
              lib/provenance-*.js|lib/receipt/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_docker_file() {
            case "$1" in
              Dockerfile|docker-compose.yml|.dockerignore|package.json|package-lock.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          # CI_CLASSIFIER_FUNCTIONS_END

          runtime_or_test=no
          perf=no
          docker=no
          nightly=no
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            nightly=yes
          fi

          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            if is_runtime_file "${f}"; then runtime_or_test=yes; fi
            if is_test_file     "${f}"; then runtime_or_test=yes; fi
            if is_perf_file     "${f}"; then perf=yes; fi
            if is_docker_file   "${f}"; then docker=yes; fi
          done <<< "${CHANGED}"

          echo "runtime_or_test=${runtime_or_test}" >> "${GITHUB_OUTPUT}"
          echo "perf=${perf}"                         >> "${GITHUB_OUTPUT}"
          echo "docker=${docker}"                     >> "${GITHUB_OUTPUT}"
          echo "nightly=${nightly}"                   >> "${GITHUB_OUTPUT}"

          {
            echo "## CI change classification"
            echo ""
            echo "Changed files:"
            echo ""
            echo '```'
            echo "${CHANGED}"
            echo '```'
            echo ""
            echo "| Surface | Triggered |"
            echo "|---|---|"
            echo "| runtime/test (npm test) | ${runtime_or_test} |"
            echo "| perf-sensitive (benchmark) | ${perf} |"
            echo "| docker/package (docker build) | ${docker} |"
            echo "| nightly/full selection | ${nightly} |"
            echo ""
            echo "Security Checks always runs (separate workflow, not conditionalized)."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Fast feedback — static checks and a small contract smoke run in parallel
  # with the weighted full-suite shards. This is advisory; runtime-test-gate
  # below remains the stable required check for the complete test surface.
  # ---------------------------------------------------------------------
  fast-contract:
    name: Fast contract checks
    needs: [classify, test-impact-plan]
    if: needs['test-impact-plan'].outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch baseline branch for live Git validation
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # actions/checkout intentionally leaves pull-request worktrees detached.
      # The live Git guard requires branch identity as evidence; name the
      # checked-out commit without changing the commit or weakening ancestry.
      #
      # -C, not --create: on a push to main the checkout already has a local
      # `main`, and --create fails with "a branch named 'main' already exists",
      # which turned every post-merge run of this workflow red. -C points the
      # branch at $GITHUB_SHA whether or not it exists, which is the intent
      # either way.
      - name: Name checked-out branch for live Git validation
        env:
          HUQAN_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git switch -C "$HUQAN_CI_BRANCH" "$GITHUB_SHA"
      # GitHub can materialize the pull-request merge ref before a newer main
      # commit lands. Merge the fetched baseline into this ephemeral test
      # branch so the live guard measures the same current ancestry that CI
      # fetched, while still failing on a real merge conflict.
      - name: Materialize current baseline ancestry for live Git validation
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - name: Run fast static checks
        run: |
          set -euo pipefail
          npm run check:package-closure
          npm run check:file-size
          npm run check:control-chars
          npm run check:doc-status
          npm run check:workflow-governance
      - name: Run fast contract tests
        run: >-
          node --test --test-concurrency=2
          test/agent-context.test.js
          test/quickstart-first-run.test.js
          test/agent-activity-dashboard-contract.test.js

  # ---------------------------------------------------------------------
  # Deterministic impact plan. The plan is always produced on PRs and on
  # nightly/manual runs. Agent additions, when supplied by a trusted caller,
  # are validated as add-only; the selector itself owns the mandatory union.
  # ---------------------------------------------------------------------
  test-impact-plan:
    name: Test impact plan
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.plan.outputs.run_tests }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch baseline branch for live Git validation
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate and validate impact plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNTIME_OR_TEST: ${{ needs.classify.outputs.runtime_or_test }}
          NIGHTLY: ${{ needs.classify.outputs.nightly }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mode=pr
          if [ "${NIGHTLY}" = "yes" ]; then mode=nightly; fi
          agent_args=()
          if [ -f .huqan/agent-test-plan.json ]; then
            agent_args+=(--agent-plan=.huqan/agent-test-plan.json)
          fi
          node scripts/ci-impact-plan.js \
            --base="${BASE_SHA}" \
            --head="${HEAD_SHA}" \
            --mode="${mode}" \
            --runtime-or-test="${RUNTIME_OR_TEST}" \
            "${agent_args[@]}" \
            --output=artifacts/test-impact-plan.json
          node -e "const fs=require('node:fs'); const p=require('./scripts/ci-impact-plan'); const plan=JSON.parse(fs.readFileSync('artifacts/test-impact-plan.json','utf8')); p.validateImpactPlan(plan,p.discoverKnownTests());"
          node -e "const p=JSON.parse(require('node:fs').readFileSync('artifacts/test-impact-plan.json','utf8')); console.log(JSON.stringify({runTests:p.runTests,fullSuite:p.fullSuite,changedFiles:p.changedFiles.length,selectedTests:p.selectedTestCount,knownTests:p.knownTestCount,matchedImpactRules:p.matchedImpactRules,agent:p.agent},null,2));"
          run_tests="$(node -p 'JSON.parse(require("node:fs").readFileSync("artifacts/test-impact-plan.json", "utf8")).runTests')"
          full_suite="$(node -p 'JSON.parse(require("node:fs").readFileSync("artifacts/test-impact-plan.json", "utf8")).fullSuite')"
          echo "run_tests=${run_tests}" >> "${GITHUB_OUTPUT}"
          echo "full_suite=${full_suite}" >> "${GITHUB_OUTPUT}"
      - name: Publish impact plan summary
        if: always()
        run: |
          if [ -f artifacts/test-impact-plan.json ]; then
            {
              echo "## Test impact plan"
              echo ""
              node -e "const p=JSON.parse(require('node:fs').readFileSync('artifacts/test-impact-plan.json','utf8')); console.log('| Field | Value |'); console.log('|---|---|'); console.log('| Mode | '+p.mode+' |'); console.log('| Changed files | '+p.changedFiles.length+' |'); console.log('| Selected tests | '+p.selectedTestCount+' / '+p.knownTestCount+' |'); console.log('| Full suite fallback | '+p.fullSuite+' |'); console.log('| Impact rules | '+(p.matchedImpactRules.join(', ') || 'none')+' |'); console.log('| Agent status | '+p.agent.status+' |');"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload impact plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-impact-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/test-impact-plan.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # npm test — the impact plan selects the PR surface and the three shard legs
  # distribute that plan across independent CI runners. Nightly/manual modes
  # select the complete discovered test-file set.
  # ---------------------------------------------------------------------
  runtime-test:
    name: npm test (runtime/test selected, Node ${{ matrix.node-version }}, shard ${{ matrix.shard }})
    needs: [classify, test-impact-plan]
    if: needs['test-impact-plan'].outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life on 2026-04-30 and the package declares
        # engines >=22.13.0, so there is one supported runtime leg.
        node-version: [22]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The agent-context guard validates live Git state against origin/main,
      # so fetch the baseline explicitly after checkout.
      - name: Fetch baseline branch for live Git validation
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # Pull-request checkouts are detached by design. Name the checked-out
      # commit so live Git validation has branch identity as evidence; this
      # does not alter the commit or weaken the ancestry check.
      #
      # -C, not --create: on a push to main the checkout already has a local
      # `main`, and --create fails with "a branch named 'main' already exists",
      # which turned every post-merge run of this workflow red. -C points the
      # branch at $GITHUB_SHA whether or not it exists, which is the intent
      # either way.
      - name: Name checked-out branch for live Git validation
        env:
          HUQAN_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git switch -C "$HUQAN_CI_BRANCH" "$GITHUB_SHA"
      # GitHub can materialize the pull-request merge ref before a newer main
      # commit lands. Merge the fetched baseline into this ephemeral test
      # branch so the live guard measures the same current ancestry, while a
      # real merge conflict still fails the job.
      - name: Materialize current baseline ancestry for live Git validation
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - name: Download validated impact plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-impact-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts
      - name: Run selected weighted test shard
        run: >-
          node scripts/run-test-shard.js
          --selection=artifacts/test-impact-plan.json
          --shard=${{ matrix.shard }}
          --total=3
          --concurrency=1
          --report=artifacts/test-shard-${{ matrix.shard }}.xml
        env:
          # A browser smoke that skips silently is not evidence; the runner
          # image is expected to provide Chrome and global WebSocket support.
          # Shards provide process-level CI parallelism. Keep each shard serial
          # because legacy JSON tests share default persistence within a runner.
          HUQAN_REQUIRE_BROWSER_SMOKE: '1'
      - name: Upload JUnit timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: artifacts/test-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  runtime-test-skip:
    name: npm test (runtime/test)
    needs: [classify, test-impact-plan]
    if: needs['test-impact-plan'].outputs.run_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report NOT_APPLICABLE
        run: |
          echo "## npm test: NOT_APPLICABLE" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "No runtime or test files changed in this PR." >> "${GITHUB_STEP_SUMMARY}"
          echo "Selected impact test plan skipped (NOT_APPLICABLE)." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "If your change intentionally touches a runtime surface" >> "${GITHUB_STEP_SUMMARY}"
          echo "(kernel.js, graph.js, plugins/**, lib/**, nlp/**, test/**, etc.)," >> "${GITHUB_STEP_SUMMARY}"
          echo "rerun the workflow manually or push the change to a runtime-classified path." >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Benchmark regression — only on performance-sensitive changes.
  # ---------------------------------------------------------------------
  benchmark:
    name: Benchmark
    needs: classify
    if: needs.classify.outputs.perf == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional

      - name: Run benchmark
        run: node benchmarks/bench.js --json --quick > benchmarks/current-results.json
      - name: Check regression
        run: node benchmarks/check-regression.js benchmarks/results.json benchmarks/current-results.json --multiplier=2.5
      - name: Run observability load smoke
        run: node benchmarks/observability-load-smoke.js > benchmarks/observability-load-current.json
      - name: Upload observability load-smoke artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observability-load-smoke-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: benchmarks/observability-load-current.json
          if-no-files-found: warn
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "## Benchmark Summary"
            echo ""
            node benchmarks/check-regression.js benchmarks/results.json benchmarks/current-results.json --multiplier=2.5
            echo ""
            echo "## Observability Load Smoke"
            if [ -f benchmarks/observability-load-current.json ]; then
              cat benchmarks/observability-load-current.json
            else
              echo "Load-smoke report was not produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  benchmark-skip:
    name: Benchmark
    needs: classify
    if: needs.classify.outputs.perf != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Report NOT_APPLICABLE
        run: |
          echo "## Benchmark: NOT_APPLICABLE" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "No performance-sensitive files changed in this PR." >> "${GITHUB_STEP_SUMMARY}"
          echo "Benchmark regression check skipped (NOT_APPLICABLE)." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Perf-sensitive file groups:" >> "${GITHUB_STEP_SUMMARY}"
          echo "- benchmarks/** (bench, check-regression, fixtures, results.json)" >> "${GITHUB_STEP_SUMMARY}"
          echo "- graph.js, kernel.js, kernel.v2.js, storage.js" >> "${GITHUB_STEP_SUMMARY}"
          echo "- causalSimulator.js, finalizer.js, rustGraph.js" >> "${GITHUB_STEP_SUMMARY}"
          echo "- lib/memory-store.js, lib/ingest.js, lib/causal/*, lib/provenance-*.js, lib/receipt/*" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "If you intentionally touched a perf-sensitive surface and need benchmark validation," >> "${GITHUB_STEP_SUMMARY}"
          echo "rerun the Benchmark workflow manually from the Actions tab." >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Docker build — only when Docker / package / deploy surfaces change.
  # Separated from the benchmark job so that benchmark-only PRs do not pay
  # the Docker build cost, and Docker/package PRs do not require benchmark.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker build
    needs: classify
    if: needs.classify.outputs.docker == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t huqan:test .

      - name: Run Docker runtime smoke
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            --name "huqan-smoke-${GITHUB_RUN_ID}" \
            -e HUQAN_API_KEY=ci-smoke-only \
            -p 127.0.0.1:18080:3000 \
            huqan:test)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_status="starting"
          for _ in $(seq 1 45); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}" 2>/dev/null || true)"
            if [ "${health_status}" = "healthy" ]; then break; fi
            if [ "${health_status}" = "unhealthy" ]; then
              echo "Container healthcheck reported unhealthy." >&2
              exit 1
            fi
            sleep 2
          done
          test "${health_status}" = "healthy"

          curl --fail --silent --show-error http://127.0.0.1:18080/health
          docker exec "${container_id}" sh -c \
            '! command -v python3 && ! command -v g++ && test "$(id -u)" -ne 0 && test -w /app/data'

  docker-build-skip:
    name: Docker build
    needs: classify
    if: needs.classify.outputs.docker != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Report NOT_APPLICABLE
        run: |
          echo "## Docker build: NOT_APPLICABLE" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "No Dockerfile / docker-compose / .dockerignore / package.json / package-lock.json changes." >> "${GITHUB_STEP_SUMMARY}"
          echo "Docker build skipped (NOT_APPLICABLE)." >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Stable required checks. These aggregate the run/skip pairs so branch
  # protection does not depend on matrix-generated or conditional job names.
  # ---------------------------------------------------------------------
  runtime-test-gate:
    name: npm test gate
    needs: [classify, test-impact-plan, runtime-test, runtime-test-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable test path to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PLAN_RESULT: ${{ needs['test-impact-plan'].result }}
          TEST_RESULT: ${{ needs['runtime-test'].result }}
          SKIP_RESULT: ${{ needs['runtime-test-skip'].result }}
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = success
          test "${PLAN_RESULT}" = success
          if [ "${TEST_RESULT}" != success ] && [ "${SKIP_RESULT}" != success ]; then
            echo "Neither the test job nor its NOT_APPLICABLE job passed." >&2
            exit 1
          fi

  benchmark-gate:
    name: Benchmark gate
    needs: [classify, benchmark, benchmark-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable benchmark path to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          SKIP_RESULT: ${{ needs['benchmark-skip'].result }}
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = success
          if [ "${BENCHMARK_RESULT}" != success ] && [ "${SKIP_RESULT}" != success ]; then
            echo "Neither the benchmark job nor its NOT_APPLICABLE job passed." >&2
            exit 1
          fi

  docker-build-gate:
    name: Docker build gate
    needs: [classify, docker-build, docker-build-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable Docker path to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCKER_RESULT: ${{ needs['docker-build'].result }}
          SKIP_RESULT: ${{ needs['docker-build-skip'].result }}
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = success
          if [ "${DOCKER_RESULT}" != success ] && [ "${SKIP_RESULT}" != success ]; then
            echo "Neither the Docker job nor its NOT_APPLICABLE job passed." >&2
            exit 1
          fi
