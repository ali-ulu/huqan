name: Benchmark Regression

# Conditional CI gate policy — see
# docs/refactor/refactor-4d-contract-acceptance.md §3 and §4.
#
# Three independent surfaces, each with its own (run | skip) job pair so the
# status check always appears on every PR and reports either a real result
# or NOT_APPLICABLE. Branch protection can require "npm test (runtime/test)",
# "Benchmark", and "Docker build" without blocking docs-only or
# performance-neutral PRs.
#
#   runtime/test change  →  npm test runs            (mandatory)
#   perf-sensitive       →  npm test + benchmark     (mandatory on runtime)
#   docker/package       →  docker build runs        (mandatory on docker)
#   docs-only / nothing  →  all three NOT_APPLICABLE
#
# Security Checks (security.yml) stays mandatory on every PR and is
# intentionally NOT conditionalized here.

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR supersedes stale classification/test work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Classify which surfaces changed. Always runs. Outputs three boolean
  # strings ("yes" / "no") consumed by downstream jobs' if: conditions.
  # ---------------------------------------------------------------------
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime_or_test: ${{ steps.classify.outputs.runtime_or_test }}
      perf: ${{ steps.classify.outputs.perf }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" || true)
          else
            # push to main: compare against the parent commit
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi

          # Trim and de-duplicate
          CHANGED=$(echo "${CHANGED}" | sed '/^[[:space:]]*$/d' | sort -u)

          # CI_CLASSIFIER_FUNCTIONS_START
          is_runtime_file() {
            # Runtime files whose change requires the full npm test suite.
            #
            # Deny-by-default (#752). The previous form was a hand-maintained
            # allowlist, and it had already drifted: adapters/* is published by
            # package.json#files and is on the production ingest path, and
            # github-app-server.js is a declared production entry point in
            # lib/module-reachability.js. A PR touching only those left
            # runtime_or_test=no, so branch protection saw the required
            # npm test check satisfied by the NOT_APPLICABLE skip job while a
            # shipped surface changed untested.
            #
            # scripts/* and benchmarks/* are here because package.json#files
            # publishes backup.js, restore.js, egitim-demo.js, bench.js and
            # verifBench.js; the exclusions above are matched first so
            # benchmarks/fixtures/* stays out.
            #
            # The final `*.js` arm is what makes it fail closed: a new root
            # production file counts as runtime until someone classifies it
            # otherwise, rather than being silently exempt.
            case "$1" in
              docs/*|specs/*|test/*|benchmarks/fixtures/*|fixtures/*|public/*|obsidian-plugin/*)
                return 1
                ;;
              plugins/*|lib/*|nlp/*|packages/*|migrations/*|schemas/*|adapters/*|scripts/*|benchmarks/*)
                return 0
                ;;
              */*)
                # Any other nested path is not a runtime surface.
                return 1
                ;;
              *.js)
                # Unclassified root-level JavaScript: treat as production.
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_test_file() {
            # Test-only changes run npm test but do not trigger benchmark.
            case "$1" in
              test/*|*.test.js|*.spec.js)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_perf_file() {
            # Performance-sensitive files trigger the benchmark regression gate.
            case "$1" in
              benchmarks/bench.js|benchmarks/check-regression.js|benchmarks/bench-memory-scale.js|\
              benchmarks/snapshot-memory.js|benchmarks/verifBench.js|benchmarks/results.json|\
              benchmarks/fixtures/*|graph.js|kernel.js|kernel.v2.js|storage.js|causalSimulator.js|\
              finalizer.js|rustGraph.js|lib/memory-store.js|lib/ingest.js|lib/causal/*|\
              lib/provenance-*.js|lib/receipt/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_docker_file() {
            case "$1" in
              Dockerfile|docker-compose.yml|.dockerignore|package.json|package-lock.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          # CI_CLASSIFIER_FUNCTIONS_END

          runtime_or_test=no
          perf=no
          docker=no

          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            if is_runtime_file "${f}"; then runtime_or_test=yes; fi
            if is_test_file     "${f}"; then runtime_or_test=yes; fi
            if is_perf_file     "${f}"; then perf=yes; fi
            if is_docker_file   "${f}"; then docker=yes; fi
          done <<< "${CHANGED}"

          echo "runtime_or_test=${runtime_or_test}" >> "${GITHUB_OUTPUT}"
          echo "perf=${perf}"                         >> "${GITHUB_OUTPUT}"
          echo "docker=${docker}"                     >> "${GITHUB_OUTPUT}"

          {
            echo "## CI change classification"
            echo ""
            echo "Changed files:"
            echo ""
            echo '```'
            echo "${CHANGED}"
            echo '```'
            echo ""
            echo "| Surface | Triggered |"
            echo "|---|---|"
            echo "| runtime/test (npm test) | ${runtime_or_test} |"
            echo "| perf-sensitive (benchmark) | ${perf} |"
            echo "| docker/package (docker build) | ${docker} |"
            echo ""
            echo "Security Checks always runs (separate workflow, not conditionalized)."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # npm test — mandatory on runtime OR test changes.
  # ---------------------------------------------------------------------
  runtime-test:
    name: npm test (runtime/test, Node ${{ matrix.node-version }})
    needs: classify
    if: needs.classify.outputs.runtime_or_test == 'yes'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README advertises Node 20 LTS and 22 LTS as recommended runtimes.
        # Test both so a regression on 22 is caught before it reaches users.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # actions/checkout only creates a remote-tracking ref for the ref it
      # checked out, so `origin/main` does not resolve here. The agent-context
      # guard in test/agent-context.test.js validates live Git state against
      # origin/main and fails closed without it, so fetch the baseline branch
      # explicitly before running the suite.
      - name: Fetch baseline branch for live Git validation
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --include=optional
      - name: Run full test suite
        run: npm test

  runtime-test-skip:
    name: npm test (runtime/test)
    needs: classify
    if: needs.classify.outputs.runtime_or_test != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Report NOT_APPLICABLE
        run: |
          echo "## npm test: NOT_APPLICABLE" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "No runtime or test files changed in this PR." >> "${GITHUB_STEP_SUMMARY}"
          echo "Full npm test suite skipped (NOT_APPLICABLE)." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "If your change intentionally touches a runtime surface" >> "${GITHUB_STEP_SUMMARY}"
          echo "(kernel.js, graph.js, plugins/**, lib/**, nlp/**, test/**, etc.)," >> "${GITHUB_STEP_SUMMARY}"
          echo "rerun the workflow manually or push the change to a runtime-classified path." >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Benchmark regression — only on performance-sensitive changes.
  # ---------------------------------------------------------------------
  benchmark:
    name: Benchmark
    needs: classify
    if: needs.classify.outputs.perf == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=optional

      - name: Run benchmark
        run: node benchmarks/bench.js --json --quick > benchmarks/current-results.json

      - name: Check regression
        run: node benchmarks/check-regression.js benchmarks/results.json benchmarks/current-results.json --multiplier=2.5

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "## Benchmark Summary"
            echo ""
            node benchmarks/check-regression.js benchmarks/results.json benchmarks/current-results.json --multiplier=2.5
          } >> "${GITHUB_STEP_SUMMARY}"

  benchmark-skip:
    name: Benchmark
    needs: classify
    if: needs.classify.outputs.perf != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Report NOT_APPLICABLE
        run: |
          echo "## Benchmark: NOT_APPLICABLE" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "No performance-sensitive files changed in this PR." >> "${GITHUB_STEP_SUMMARY}"
          echo "Benchmark regression check skipped (NOT_APPLICABLE)." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Perf-sensitive file groups:" >> "${GITHUB_STEP_SUMMARY}"
          echo "- benchmarks/** (bench, check-regression, fixtures, results.json)" >> "${GITHUB_STEP_SUMMARY}"
          echo "- graph.js, kernel.js, kernel.v2.js, storage.js" >> "${GITHUB_STEP_SUMMARY}"
          echo "- causalSimulator.js, finalizer.js, rustGraph.js" >> "${GITHUB_STEP_SUMMARY}"
          echo "- lib/memory-store.js, lib/ingest.js, lib/causal/*, lib/provenance-*.js, lib/receipt/*" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "If you intentionally touched a perf-sensitive surface and need benchmark validation," >> "${GITHUB_STEP_SUMMARY}"
          echo "rerun the Benchmark workflow manually from the Actions tab." >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Docker build — only when Docker / package / deploy surfaces change.
  # Separated from the benchmark job so that benchmark-only PRs do not pay
  # the Docker build cost, and Docker/package PRs do not require benchmark.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker build
    needs: classify
    if: needs.classify.outputs.docker == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t huqan:test .

      - name: Run Docker runtime smoke
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            --name "huqan-smoke-${GITHUB_RUN_ID}" \
            -e HUQAN_API_KEY=ci-smoke-only \
            -p 127.0.0.1:18080:3000 \
            huqan:test)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_status="starting"
          for _ in $(seq 1 45); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}" 2>/dev/null || true)"
            if [ "${health_status}" = "healthy" ]; then break; fi
            if [ "${health_status}" = "unhealthy" ]; then
              echo "Container healthcheck reported unhealthy." >&2
              exit 1
            fi
            sleep 2
          done
          test "${health_status}" = "healthy"

          curl --fail --silent --show-error http://127.0.0.1:18080/health
          docker exec "${container_id}" sh -c \
            '! command -v python3 && ! command -v g++ && test "$(id -u)" -ne 0 && test -w /app/data'

  docker-build-skip:
    name: Docker build
    needs: classify
    if: needs.classify.outputs.docker != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Report NOT_APPLICABLE
        run: |
          echo "## Docker build: NOT_APPLICABLE" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "No Dockerfile / docker-compose / .dockerignore / package.json / package-lock.json changes." >> "${GITHUB_STEP_SUMMARY}"
          echo "Docker build skipped (NOT_APPLICABLE)." >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------
  # Stable required checks. These aggregate the run/skip pairs so branch
  # protection does not depend on matrix-generated or conditional job names.
  # ---------------------------------------------------------------------
  runtime-test-gate:
    name: npm test gate
    needs: [classify, runtime-test, runtime-test-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable test path to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          TEST_RESULT: ${{ needs['runtime-test'].result }}
          SKIP_RESULT: ${{ needs['runtime-test-skip'].result }}
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = success
          if [ "${TEST_RESULT}" != success ] && [ "${SKIP_RESULT}" != success ]; then
            echo "Neither the test job nor its NOT_APPLICABLE job passed." >&2
            exit 1
          fi

  benchmark-gate:
    name: Benchmark gate
    needs: [classify, benchmark, benchmark-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable benchmark path to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          SKIP_RESULT: ${{ needs['benchmark-skip'].result }}
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = success
          if [ "${BENCHMARK_RESULT}" != success ] && [ "${SKIP_RESULT}" != success ]; then
            echo "Neither the benchmark job nor its NOT_APPLICABLE job passed." >&2
            exit 1
          fi

  docker-build-gate:
    name: Docker build gate
    needs: [classify, docker-build, docker-build-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable Docker path to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCKER_RESULT: ${{ needs['docker-build'].result }}
          SKIP_RESULT: ${{ needs['docker-build-skip'].result }}
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = success
          if [ "${DOCKER_RESULT}" != success ] && [ "${SKIP_RESULT}" != success ]; then
            echo "Neither the Docker job nor its NOT_APPLICABLE job passed." >&2
            exit 1
          fi
