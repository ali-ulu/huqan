name: PR Guardian self-review

# HUQAN governing its own pull requests.
#
# The webhook workflow beside this one is the path an operator wires to a
# deployed HUQAN; it is gated on PR_GUARDIAN_WEBHOOK_URL and has never fired
# here, because a webhook cannot reach a laptop (#1968). This job needs no
# endpoint: `evaluatePullRequest` is a pure function over a snapshot, so the
# snapshot is fetched and evaluated in the runner.
#
# What it therefore cannot do is emit a canonical Trust Receipt. That belongs to
# the runtime, and remains the reason to stand the webhook path up.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-guardian-self-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: HUQAN PR Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the base tree, never the PR merge commit. The policy this job
      # runs decides whether the change is safe, so a pull request must not be
      # able to supply its own copy of it -- a one-line edit to policy.js would
      # otherwise let any change approve itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No install step: the policy is dependency-free, and skipping npm ci
      # keeps the reviewed tree from running any lifecycle script.
      # The workflow definition comes from the pull request while the tree comes
      # from the base, so on the change that introduces this job the script does
      # not exist yet. That is the only situation in which it can be missing --
      # once merged, `main` always has it -- and blocking the pull request that
      # adds the reviewer would be a strange way to start. Every other absence
      # is impossible, so a plain guard is enough and fail-closed still governs
      # everything the script itself does.
      # The OCR reviewer (#3198). Which LLM serves it is not decided here: the
      # job passes OpenCodeReview's provider-neutral variables from repository
      # secrets, so choosing a provider means setting OCR_LLM_URL, OCR_LLM_TOKEN,
      # OCR_LLM_MODEL and OCR_LLM_PROTOCOL (openai or anthropic). With none set,
      # nothing is installed and the reviewer reports `unknown`, never a block.
      # The binary is the release asset, pinned by version and by a sha256
      # recorded here -- not the npm package, whose postinstall runs code.
      - name: Install the OCR reviewer
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_VERSION: 1.12.11
          OCR_SHA256: ae202b88fa03e16926512487bf1051d37ccb3f9690bdd74b889d11ea4dd8099b
        run: |
          set -euo pipefail
          if [ -z "${OCR_LLM_URL:-}${OCR_LLM_TOKEN:-}${OCR_LLM_MODEL:-}" ]; then
            echo "::notice title=HUQAN PR Guardian::No OCR_LLM_* secrets; the OCR reviewer is skipped (#3198)."
            exit 0
          fi
          bin="${RUNNER_TEMP}/ocr-bin"
          mkdir -p "$bin"
          curl --fail --silent --show-error --location --retry 3 --output "$bin/ocr"             "https://github.com/alibaba/open-code-review/releases/download/v${OCR_VERSION}/opencodereview-linux-amd64"
          echo "${OCR_SHA256}  $bin/ocr" | sha256sum --check --strict
          chmod +x "$bin/ocr"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Evaluate the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_LLM_PROTOCOL: ${{ secrets.OCR_LLM_PROTOCOL }}
          OCR_ENABLE_TELEMETRY: 'false'
          OCR_NO_UPDATE: '1'
        run: |
          set -euo pipefail
          if [ ! -f scripts/pr-guardian-self-review.js ]; then
            echo "::notice title=HUQAN PR Guardian::Not present on the base branch yet; this is the change that adds it."
            exit 0
          fi
          node scripts/pr-guardian-self-review.js

      # The SARIF ride-along (#3198). This job holds read-only permissions by
      # contract (pinned by test/pr-guardian-self-review.test.js), so the
      # findings travel as an artifact and pr-guardian-ocr-sarif.yml, which
      # alone holds `security-events: write`, publishes them to Code Scanning.
      # Absent when no LLM endpoint is configured, hence `ignore`.
      - name: Upload OCR findings SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-findings
          path: ${{ runner.temp }}/ocr-findings.sarif
          if-no-files-found: ignore
          retention-days: 14
