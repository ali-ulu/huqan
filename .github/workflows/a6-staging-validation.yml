name: A6 Staging Validation

on:
  push:
    branches:
      - chore/architecture-graph-drift-staging

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run A6 graph tests
        run: node --test test/architecture-graph-drift.test.js

      - name: Inspect live graph snapshot
        run: |
          node - <<'NODE'
          const { buildArchitectureGraphSnapshot } = require('./scripts/architecture-graph-snapshot');
          const snapshot = buildArchitectureGraphSnapshot();
          console.log(JSON.stringify({
            modules: Object.keys(snapshot.modules).length,
            edges: snapshot.edges.length,
            violations: snapshot.violations.length,
          }));
          if (snapshot.violations.length) process.exit(1);
          NODE
