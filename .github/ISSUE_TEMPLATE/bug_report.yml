name: Bug report
description: Report a reproducible defect in HUQAN
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a HUQAN defect. Please separate observed behavior from expectations and include the smallest reproducible case you can. If you are also preparing a fix, run `npm run verify` before pushing it.
  - type: input
    id: version
    attributes:
      label: HUQAN version / commit
      description: npm version, tag, or commit SHA
      placeholder: v0.12.0 or 46b7333
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Kernel / library
        - CLI
        - MCP
        - REST API
        - External action guard
        - A2A
        - Trust Receipt Viewer
        - Plugin system
        - Packaging / release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands, code, payload, or sequence that reproduces the issue
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, receipt ids, stack traces, screenshots, or failing test names. Remove secrets first.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager, optional Rust accelerator, deployment mode
      placeholder: Windows 11, Node 22.13, npm 11, Rust accelerator off
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, credentials, and sensitive data.
          required: true
        - label: This is not a sensitive security vulnerability; those should follow SECURITY.md.
          required: true
