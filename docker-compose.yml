services:
  huqan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huqan
    ports:
      - "${HUQAN_PORT:-${AXIOM_PORT:-3000}}:3000"
    environment:
      - PORT=3000
      - HUQAN_PORT
      - AXIOM_PORT
      - HUQAN_HOST
      - AXIOM_HOST
      - HUQAN_MEMORY_PATH
      - AXIOM_MEMORY_PATH
      - HUQAN_DB_PATH
      - AXIOM_DB_PATH
      - HUQAN_BACKUP_DIR
      - AXIOM_BACKUP_DIR
      - HUQAN_KERNEL_VERSION
      - AXIOM_KERNEL_VERSION
      - HUQAN_AGENT_VERSION
      - AXIOM_AGENT_VERSION
      - HUQAN_API_KEY
      - AXIOM_API_KEY
      - HUQAN_TRUST_PROXY
      - AXIOM_TRUST_PROXY
    volumes:
      - huqan-data:/app/data
      # Writable tmpfs for SQLite WAL and other transient files (read-only root fs)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 65536
    restart: unless-stopped
    # Container hardening
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3000/health',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Renamed from `axiom-data`. An existing deployment keeps its old volume, which
  # is no longer mounted -- migrate before the first `up` with:
  #   docker run --rm -v <project>_axiom-data:/from -v <project>_huqan-data:/to \
  #     alpine sh -c "cp -a /from/. /to/"
  huqan-data:
