services:
  huqan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huqan
    ports:
      - "${HUQAN_PORT:-${AXIOM_PORT:-3000}}:3000"
    environment:
      - PORT=3000
      - HUQAN_PORT
      - AXIOM_PORT
      - HUQAN_HOST
      - AXIOM_HOST
      - HUQAN_MEMORY_PATH
      - AXIOM_MEMORY_PATH
      - HUQAN_DB_PATH
      - AXIOM_DB_PATH
      - HUQAN_BACKUP_DIR
      - AXIOM_BACKUP_DIR
      - HUQAN_KERNEL_VERSION
      - AXIOM_KERNEL_VERSION
      - HUQAN_AGENT_VERSION
      - AXIOM_AGENT_VERSION
      - HUQAN_API_KEY
      - AXIOM_API_KEY
      - HUQAN_TRUST_PROXY
      - AXIOM_TRUST_PROXY
    volumes:
      - axiom-data:/app/data
      # Writable tmpfs for SQLite WAL and other transient files (read-only root fs)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864 # 64 MiB
    restart: unless-stopped
    # Container hardening
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3000/health',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1);});"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Deliberately still `axiom-data`, unlike the service and container above.
  #
  # A volume name is a data binding, not a label: the actual volume is
  # `<project>_axiom-data` and it holds the SQLite graph an existing install
  # already depends on. Renaming the key silently mounts a fresh empty volume
  # and the operator sees their graph vanish -- the one failure a trust product
  # must never produce quietly.
  #
  # So this sits with the other AXIOM names that bind data rather than describe
  # it (the graph identity node, the ATP 0.1 wire format): it moves in an
  # announced breaking release, with a migration, not in a rename pass.
  axiom-data:
