{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huqan.fullname" . }}
  labels:
    {{- include "huqan.labels" . | nindent 4 }}
type: Opaque
# Both values must be set in values.yaml (or --set) when this Secret is
# chart-managed. Generate strong values, e.g.: openssl rand -hex 32
stringData:
  HUQAN_API_KEY: {{ required "auth.apiKey is required unless auth.existingSecret is set" .Values.auth.apiKey | quote }}
  HUQAN_MCP_OPERATOR_TOKEN: {{ required "auth.operatorToken is required unless auth.existingSecret is set" .Values.auth.operatorToken | quote }}
{{- end }}
