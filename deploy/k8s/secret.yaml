apiVersion: v1
kind: Secret
metadata:
  name: huqan-secrets
  namespace: huqan
  labels:
    app.kubernetes.io/name: huqan
    app.kubernetes.io/component: runtime
# ---------------------------------------------------------------------
# REPLACE BOTH PLACEHOLDERS BEFORE APPLYING.
#
#   HUQAN_API_KEY is required for every container start:
#   scripts/container-server.js refuses to boot without it and fails
#   closed with code HUQAN_API_KEY_REQUIRED (observed in source).
#
#   HUQAN_MCP_OPERATOR_TOKEN gates the operator-only MCP tools
#   (huqan.approve, huqan.approvals, huqan.agent_resume). A model that
#   proposes a mutation cannot approve it; keep this token operator-held.
#
# Generate strong values, for example:
#   openssl rand -hex 32
#
# Recommended: do not commit real values. Sealing with SOPS/sealed-secrets
# or creating the Secret imperatively is the operator's choice and stays
# out of scope here.
# ---------------------------------------------------------------------
stringData:
  HUQAN_API_KEY: "REPLACE_ME_API_KEY"
  HUQAN_MCP_OPERATOR_TOKEN: "REPLACE_ME_OPERATOR_TOKEN"
